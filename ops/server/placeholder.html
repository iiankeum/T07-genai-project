<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>콜노트(가칭) 데모 · 준비 중</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --sub:#5b6476; --line:#e3e6ec; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151b; --card:#1b2029; --ink:#e8ecf3; --sub:#9aa4b5; --line:#2a313d; --accent:#7aa5ff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 22px; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { margin:8px 0; color:var(--sub); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:8px; animation:p 1.6s infinite; }
  @keyframes p { 50% { opacity:.3; } }
  a { color:var(--accent); }
  small { display:block; margin-top:18px; color:var(--sub); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>콜노트(가칭) 데모</h1>
  <p>지금 준비 중이거나 새 버전으로 바꾸는 중입니다. 잠시 뒤 다시 열어 주세요.</p>
  <p>전화 주문을 받아써서 주문 카드로 정리해 주는 서비스의 시험 사이트입니다.</p>
  <small>T07 팀 프로젝트 · 배포 상태: <a href="/_deploy/status.json">/_deploy/status.json</a></small>
</main>
</body>
</html>
