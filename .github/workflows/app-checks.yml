name: App checks (no paid AI)
on:
  pull_request:
    paths:
      - 'src/app/**'
      - '.github/workflows/app-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/app
    env:
      AI_PROVIDER: 'off'
      ALLOW_PAID_AI: '0'
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fake-data-browser-evidence
          path: src/app/artifacts/e2e
