<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
:root{--line:#1c2530;--coral:#e4927c;--accent:#d8664c}
*{box-sizing:border-box;margin:0;padding:0}html,body{background:transparent}
body{font-family:"Noto Sans CJK KR",sans-serif;word-break:keep-all}
.slide{width:1080px;height:1920px;position:relative;margin:0 0 40px;background:transparent}
.cap{position:absolute;left:50px;right:50px;text-align:center;font-family:"Jua",sans-serif;font-size:78px;line-height:1.25;color:#fff;-webkit-text-stroke:12px var(--line);paint-order:stroke fill}
.big{position:absolute;left:0;right:0;text-align:center;font-family:"Black Han Sans",sans-serif;font-size:260px;line-height:1;color:#fff;-webkit-text-stroke:16px var(--line);paint-order:stroke fill;letter-spacing:-6px;filter:drop-shadow(10px 10px 0 var(--accent))}
.pill{position:absolute;right:40px;top:150px;font-size:32px;font-weight:700;color:#7a5b00;background:#fff3bf;border:3px solid #f2d36b;padding:8px 22px;border-radius:999px}
.band{position:absolute;left:50px;right:50px;background:rgba(28,37,48,.9);color:#fff;border-radius:28px;padding:28px 36px;text-align:center;font-size:52px;font-weight:900;line-height:1.3}
.band em{font-style:normal;color:var(--coral)}
</style></head><body>
<div class="slide"><div class="cap" style="top:200px">통화 중인데<br>또 전화가 왔다…</div></div>
<div class="slide"><div class="cap" style="top:200px">앞 전화…<br>몇 개라고 했더라?</div><div class="big" style="top:1330px">아차…!</div></div>
<div class="slide"><div class="pill">가짜 통화 데모</div><div class="band" style="top:1640px">아차가 있으면,<br>통화 끝나면 <em>주문서</em>가 남아요</div></div>
</body></html>
