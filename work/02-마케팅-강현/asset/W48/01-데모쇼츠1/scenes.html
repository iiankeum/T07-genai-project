<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../_tools/base.css">
<style>
.v{width:1080px;height:1920px;padding:220px 90px 260px;justify-content:center}
.v h1{font-size:118px;line-height:1.2}
.v .lead{font-size:52px}
.cap{position:absolute;left:0;right:0;bottom:300px;text-align:center;font-size:64px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.capbox{position:absolute;left:90px;right:90px;bottom:250px;background:var(--ink);color:#fff;border-radius:30px;padding:34px 40px;font-size:56px;font-weight:900;text-align:center;line-height:1.35}
.capbox em{font-style:normal;color:#f4b8a5}
.fake{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-size:34px;padding:10px 24px}
.shot{border-radius:34px;overflow:hidden;border:4px solid var(--line);box-shadow:0 30px 60px rgba(27,42,74,.2);background:#fff}
.shot img{display:block;width:100%}
.tap{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(232,89,12,.28);border:8px solid var(--accent)}
.handle{position:absolute;left:90px;right:90px;bottom:110px;text-align:center;font-size:40px;font-weight:700;color:var(--muted)}
.navy .handle{color:#b5cbdb}
.x{font-size:220px;line-height:1;color:var(--accent);font-weight:900}
</style></head><body>

<div class="slide v navy center">
  <h1>「두 개라고<br>했잖아요!」</h1>
  <p class="lead mt-m">부품 대리점 오후 3시의 흔한 전화 ☎</p>
  <div class="handle">@acha_lab</div>
</div>

<div class="slide v center">
  <div class="x">✕</div>
  <h1 class="mt-m">녹음 처음부터<br>다시 듣기?</h1>
  <p class="lead mt-s">파일은 시간순으로만 쌓여 있는데…</p>
  <div class="handle">@acha_lab</div>
</div>

<div class="slide v white">
  <span class="fake">가짜 통화 데모</span>
  <div class="shot" style="margin-top:80px"><img src="../../_crops/card-plate-listen.png"></div>
  <div class="tap" style="left:330px;top:965px;width:110px;height:110px;background:rgba(232,89,12,.15)"></div>
  <div class="capbox">헷갈리는 칸에 뜨는<br><em>「들어 보기」</em>를 누르면</div>
  <div class="handle">@acha_lab</div>
</div>

<div class="slide v white">
  <span class="fake">가짜 통화 데모</span>
  <div class="shot" style="margin-top:60px"><img src="../../_crops/transcript-002.png"></div>
  <div class="capbox">그 말을 한 <em>0:02</em>부터<br>바로 재생 ▶</div>
  <div class="handle">@acha_lab</div>
</div>

<div class="slide v navy center">
  <h1>누르면 그 녹음,<br><em>3초</em>면 확인.</h1>
  <p class="lead mt-m">부품 주문 전화를<br>주문 카드로 만들고 있어요</p>
  <div class="handle" style="color:#fff;font-size:48px">아차 · @acha_lab</div>
</div>
</body></html>
