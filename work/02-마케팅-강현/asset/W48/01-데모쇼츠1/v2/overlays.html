<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 데모 쇼츠 #1 v2 — 영상 위에 얹는 글자 판(투명 PNG). AI 초안 · 돌린 사람: 금*현 · Claude · 2026-11-20 -->
<style>
:root{--ink:#3a5f79;--accent:#d8664c;--coral:#e4927c;--line:#1c2530}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:"Noto Sans CJK KR",sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
.slide{width:1080px;height:1920px;position:relative;overflow:hidden;margin:0 0 40px;background:transparent}
.cap{position:absolute;left:60px;right:60px;text-align:center;font-family:"Jua",sans-serif;font-size:76px;line-height:1.25;color:#fff;-webkit-text-stroke:12px var(--line);paint-order:stroke fill}
.cap em{font-style:normal;color:var(--coral)}
.big{position:absolute;left:0;right:0;text-align:center;font-family:"Black Han Sans",sans-serif;font-size:250px;line-height:1;color:#fff;-webkit-text-stroke:16px var(--line);paint-order:stroke fill;letter-spacing:-6px;filter:drop-shadow(10px 10px 0 var(--accent))}
.pill{position:absolute;font-size:32px;font-weight:700;color:#7a5b00;background:#fff3bf;border:3px solid #f2d36b;padding:8px 22px;border-radius:999px}
.band{position:absolute;left:50px;right:50px;background:rgba(28,37,48,.9);color:#fff;border-radius:28px;padding:30px 36px;text-align:center;font-size:52px;font-weight:900;line-height:1.3}
.band em{font-style:normal;color:var(--coral)}
.end{background:#3a5f79;background-image:radial-gradient(rgba(255,255,255,.08) 3px,transparent 3.5px);background-size:30px 30px}
</style></head><body>

<!-- 1 · 플로우 영상 앞부분 -->
<div class="slide"><div class="cap" style="top:1420px">통화 끊고 나서…</div></div>

<!-- 2 · 플로우 영상 끝 -->
<div class="slide">
  <div class="big" style="top:1180px">아차…!</div>
  <div class="cap" style="top:1480px;font-size:64px">몇 개라고 했더라?</div>
</div>

<!-- 3 · 데모 구간 공통: 가짜 통화 표시 -->
<div class="slide"><div class="pill" style="right:40px;top:150px">가짜 통화 데모</div></div>

<!-- 4 · 주문서 근거 -->
<div class="slide"><div class="pill" style="right:40px;top:150px">가짜 통화 데모</div>
  <div class="band" style="top:1440px">헷갈리면 <em>근거</em>를 눌러<br>그 대목을 바로 들어요</div></div>

<!-- 5 · Ask 아차 -->
<div class="slide"><div class="pill" style="right:40px;top:150px">가짜 통화 데모</div>
  <div class="band" style="top:200px">물어보면<br>통화에서 <em>찾아서</em> 답해요</div></div>

<!-- 6 · 마무리 -->
<div class="slide end">
  <svg style="position:absolute;left:390px;top:470px" width="300" height="280" viewBox="215 205 620 580"><g fill="none" stroke="#ffffff" stroke-linecap="round"><path d="M281 478 V547" stroke-width="104"/><path d="M407 372 V607" stroke-width="104"/><path d="M526 441 V562" stroke-width="104"/><path d="M660 273 V590" stroke-width="112"/><path d="M660 421 H773" stroke-width="86"/></g><circle cx="660" cy="722" r="58" fill="#e4927c"/></svg>
  <div style="position:absolute;left:0;right:0;top:820px;text-align:center;color:#fff">
    <div style="font-family:'Black Han Sans';font-size:200px;line-height:1">아차</div>
    <div style="font-size:56px;font-weight:700;margin-top:40px;color:#e2edf5">통화 끊고 「아차」 할 때,<br><span style="color:#f4b8a5">아차가 기억하고 있어요</span></div>
    <div style="font-size:44px;font-weight:700;margin-top:90px">@acha.lab.kr</div>
    <div style="font-size:30px;margin-top:20px;color:#b5cbdb">자동차 부품 대리점용 AI · 만드는 과정 공개 중</div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:26px;color:#b5cbdb">※ 영상 속 통화는 가짜 통화 · 첫 장면은 AI로 만든 영상입니다</div>
</div>
</body></html>
