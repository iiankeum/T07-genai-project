<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../_tools/base.css">
<style>
.p{width:1080px;height:1080px;padding:0;align-items:center;justify-content:center;display:flex;flex-direction:column}
/* A: wordmark on paper */
.a{background:var(--paper)}
.a .mark{font-size:270px;font-weight:900;letter-spacing:-14px;line-height:1;color:var(--ink)}
.a .mark span{color:var(--accent)}
.a .sub{font-size:58px;font-weight:700;color:var(--ink-2);margin-top:40px;letter-spacing:4px}
/* B: speech bubble on orange */
.b{background:var(--accent)}
.b .bub{position:relative;background:#fff;border-radius:120px;padding:90px 110px;font-size:200px;font-weight:900;letter-spacing:-10px;color:var(--ink);line-height:1}
.b .bub:after{content:"";position:absolute;left:150px;bottom:-70px;border-left:70px solid transparent;border-right:20px solid transparent;border-top:90px solid #fff}
.b .bub span{color:var(--accent)}
/* C: navy with card + bang */
.c{background:var(--ink)}
.c .card{width:520px;height:620px;background:var(--paper);border-radius:50px;transform:rotate(-6deg);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 30px 0 rgba(0,0,0,.25)}
.c .bang{font-size:360px;font-weight:900;color:var(--accent);line-height:.9}
.c .word{font-size:120px;font-weight:900;color:var(--ink);letter-spacing:-6px;margin-top:10px}
</style></head><body>
<div class="slide p a">
  <div class="mark">아맞다<span>!</span></div>
  <div class="sub">통화 끊고 「아 맞다」 할 때</div>
</div>
<div class="slide p b">
  <div class="bub">아 맞다<span>!</span></div>
</div>
<div class="slide p c">
  <div class="card"><div class="bang">!</div><div class="word">아맞다</div></div>
</div>
</body></html>
