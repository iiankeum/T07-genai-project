<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9ee;font-family:"Noto Sans CJK KR",sans-serif}
.slide{width:1600px;height:900px;margin:0 auto 40px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 130px;gap:90px}
.app{width:420px;height:420px;border-radius:98px;overflow:hidden;flex:none;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.word{font-size:190px;font-weight:900;letter-spacing:-11px;line-height:1}
.latin{font-size:44px;font-weight:700;letter-spacing:10px;margin-top:30px;opacity:.75}
.name{position:absolute;left:130px;top:60px;font-size:30px;font-weight:700;opacity:.55}
svg{display:block}
</style></head><body>

<!-- A · WAVE! : 통화 파형의 마지막 막대가 느낌표가 된다 -->
<div class="slide" style="background:#f4f2ff;color:#1a12a8">
  <div class="name">A · 파형이 느낌표로</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bff"/><stop offset="1" stop-color="#2410d6"/></linearGradient></defs>
    <rect width="1000" height="1000" fill="url(#a1)"/>
    <g stroke="#d6ff3d" stroke-width="78" stroke-linecap="round">
      <path d="M215 470 V530"/>
      <path d="M335 400 V600"/>
      <path d="M455 330 V670"/>
      <path d="M575 420 V580"/>
      <path d="M720 230 V600"/>
    </g>
    <circle cx="720" cy="740" r="48" fill="#d6ff3d"/>
  </svg></div>
  <div><div class="word">아맞다</div><div class="latin">AHMATDA</div></div>
</div>

<!-- B · 아! 합자 — 산호 + 크림, 한 덩어리 -->
<div class="slide" style="background:#fff3ea;color:#2a1410">
  <div class="name">B · 「아!」 한 글자</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#f2452a"/></linearGradient></defs>
    <rect width="1000" height="1000" fill="url(#b1)"/>
    <g transform="translate(500 500) scale(.82) translate(-480 -514)">
      <circle cx="345" cy="455" r="175" fill="none" stroke="#fff4e8" stroke-width="112"/>
      <path d="M672 250 V612 M672 432 H790" stroke="#fff4e8" stroke-width="112" stroke-linecap="round" fill="none"/>
      <circle cx="672" cy="770" r="64" fill="#2a1410"/>
    </g>
  </svg></div>
  <div><div class="word">아맞다<span style="color:#f2452a">.</span></div><div class="latin">AHMATDA</div></div>
</div>

<!-- C · 말풍선 느낌표: 길쭉한 말풍선 + 꼬리가 점 -->
<div class="slide" style="background:#0f0f12;color:#f5f5f0">
  <div class="name">C · 말풍선이 곧 느낌표</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <rect width="1000" height="1000" fill="#16161b"/>
    <defs><linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cffc4"/><stop offset="1" stop-color="#2ee6a6"/></linearGradient></defs>
    <rect x="395" y="170" width="210" height="470" rx="105" fill="url(#c1)"/>
    <circle cx="500" cy="770" r="72" fill="url(#c1)"/>
    <circle cx="430" cy="690" r="0" fill="none"/>
  </svg></div>
  <div><div class="word">아맞다</div><div class="latin" style="color:#7cffc4;opacity:1">AHMATDA</div></div>
</div>

<!-- D · 기억 매듭: 손가락에 실 묶기 — 한 줄로 그린 고리와 점 -->
<div class="slide" style="background:#fffbe8;color:#141414">
  <div class="name">D · 잊지 않게, 한 번 묶기</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <rect width="1000" height="1000" fill="#ffd23f"/>
    <path d="M500 640 C500 520 330 470 330 350 C330 250 410 200 500 200 C590 200 670 250 670 350 C670 470 500 520 500 640" fill="none" stroke="#141414" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M500 640 V660" stroke="#141414" stroke-width="84" stroke-linecap="round"/>
    <circle cx="500" cy="790" r="58" fill="#141414"/>
  </svg></div>
  <div><div class="word">아맞다</div><div class="latin">AHMATDA</div></div>
</div>
</body></html>
