<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9ee;font-family:"Noto Sans CJK KR",sans-serif}
.slide{width:1600px;height:900px;margin:0 auto 40px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 130px;gap:90px}
.app{width:420px;height:420px;border-radius:98px;overflow:hidden;flex:none;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.word{font-size:230px;font-weight:900;letter-spacing:-12px;line-height:1}
.latin{font-size:44px;font-weight:700;letter-spacing:14px;margin-top:30px;opacity:.75}
.name{position:absolute;left:130px;top:60px;font-size:30px;font-weight:700;opacity:.55}
svg{display:block}
</style></head><body>

<!-- A · 점화플러그 느낌표: 몸통이 막대, 불꽃이 점 -->
<div class="slide" style="background:#11151a;color:#f4f4ef">
  <div class="name">A · 점화플러그가 느낌표</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><radialGradient id="ag" cx="50%" cy="80%" r="80%"><stop offset="0" stop-color="#2a2f20"/><stop offset="1" stop-color="#0e1114"/></radialGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect width="1000" height="1000" fill="url(#ag)"/>
    <g transform="translate(500 0)">
      <rect x="-34" y="120" width="68" height="60" rx="20" fill="#c9cdd2"/>
      <path d="M-62 180 H62 L74 460 H-74 Z" fill="#f4f1e8"/>
      <g stroke="#11151a" stroke-width="14" opacity=".25"><path d="M-66 250 H66"/><path d="M-68 300 H68"/><path d="M-70 350 H70"/></g>
      <path d="M-120 460 H120 L120 540 H-120 Z" fill="#c9cdd2"/>
      <path d="M-120 460 L-60 445 H60 L120 460" fill="#aeb3b9"/>
      <rect x="-70" y="540" width="140" height="110" fill="#8d939a"/>
      <g stroke="#6d737a" stroke-width="12"><path d="M-70 565 L70 580"/><path d="M-70 595 L70 610"/><path d="M-70 625 L70 640"/></g>
      <path d="M-14 650 V690 H40" stroke="#8d939a" stroke-width="22" fill="none" stroke-linecap="round"/>
      <g filter="url(#gl)" fill="#ffe14a">
        <path d="M0 720 L28 790 L100 800 L40 840 L60 910 L0 868 L-60 910 L-40 840 L-100 800 L-28 790 Z"/>
      </g>
    </g>
  </svg></div>
  <div><div class="word">아차</div><div class="latin" style="color:#ffe14a;opacity:1">ACHA</div></div>
</div>

<!-- B · 육각너트 「아!」 : ㅇ은 너트, ㅏ는 느낌표 -->
<div class="slide" style="background:#e6fbf1;color:#0b2a21">
  <div class="name">B · ㅇ은 육각너트</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <rect width="1000" height="1000" fill="#0f3b2e"/>
    <g transform="translate(500 500) scale(.86) translate(-480 -514)">
      <path d="M345 245 L527 350 V560 L345 665 L163 560 V350 Z" fill="#7dffc3" stroke="#7dffc3" stroke-width="40" stroke-linejoin="round"/>
      <circle cx="345" cy="455" r="92" fill="#0f3b2e"/>
      <path d="M690 250 V612 M690 432 H808" stroke="#ff8a5b" stroke-width="104" stroke-linecap="round" fill="none"/>
      <circle cx="690" cy="772" r="60" fill="#ff8a5b"/>
    </g>
  </svg></div>
  <div><div class="word">아차</div><div class="latin">ACHA</div></div>
</div>

<!-- C · 놀란 자동차: 헤드라이트 눈이 동그래진 「아차!」 얼굴 -->
<div class="slide" style="background:#fff8d6;color:#1c1300">
  <div class="name">C · 「아차!」 하는 자동차 얼굴</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <rect width="1000" height="1000" fill="#ffd93d"/>
    <path d="M300 300 Q320 230 400 230 H600 Q680 230 700 300 L735 410 H265 Z" fill="#1c1300"/>
    <path d="M330 300 Q345 262 400 262 H600 Q655 262 670 300 L695 392 H305 Z" fill="#8fe3ff"/>
    <rect x="200" y="400" width="600" height="300" rx="110" fill="#1c1300"/>
    <rect x="190" y="690" width="120" height="110" rx="34" fill="#1c1300"/>
    <rect x="690" y="690" width="120" height="110" rx="34" fill="#1c1300"/>
    <circle cx="350" cy="530" r="78" fill="#fff"/><circle cx="650" cy="530" r="78" fill="#fff"/>
    <circle cx="350" cy="510" r="30" fill="#1c1300"/><circle cx="650" cy="510" r="30" fill="#1c1300"/>
    <ellipse cx="500" cy="630" rx="38" ry="44" fill="#ff5a3c"/>
    <path d="M178 395 L230 420 M822 395 L770 420" stroke="#1c1300" stroke-width="40" stroke-linecap="round"/>
    <path d="M780 170 L760 230 M840 210 L790 250 M700 150 L705 215" stroke="#1c1300" stroke-width="26" stroke-linecap="round"/>
  </svg></div>
  <div><div class="word">아차</div><div class="latin">ACHA</div></div>
</div>

<!-- D · 렌치 수화기: 스패너 두 머리가 송화구 · 수화구 -->
<div class="slide" style="background:#f1edff;color:#22106a">
  <div class="name">D · 스패너가 곧 수화기</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3bff"/><stop offset="1" stop-color="#3a12c9"/></linearGradient></defs>
    <rect width="1000" height="1000" fill="url(#dg)"/>
    <g transform="translate(500 520) rotate(-35)">
      <path d="M-210 0 Q0 90 210 0" fill="none" stroke="#d8ff47" stroke-width="88" stroke-linecap="round"/>
      <g transform="translate(-250 -20) rotate(20)">
        <path d="M-95 -20 A110 110 0 1 0 95 -20 L40 -20 L40 30 L-40 30 L-40 -20 Z" fill="#d8ff47" transform="rotate(180)"/>
      </g>
      <g transform="translate(250 -20) rotate(-20)">
        <path d="M-95 -20 A110 110 0 1 0 95 -20 L40 -20 L40 30 L-40 30 L-40 -20 Z" fill="#d8ff47" transform="rotate(180)"/>
      </g>
    </g>
  </svg></div>
  <div><div class="word">아차</div><div class="latin">ACHA</div></div>
</div>
</body></html>
