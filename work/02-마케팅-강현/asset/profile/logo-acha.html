<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e9ee;font-family:"Noto Sans CJK KR",sans-serif}
.slide{width:1600px;height:900px;margin:0 auto 40px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 130px;gap:90px}
.app{width:420px;height:420px;border-radius:98px;overflow:hidden;flex:none;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.word{font-size:230px;font-weight:900;letter-spacing:-12px;line-height:1}
.latin{font-size:44px;font-weight:700;letter-spacing:14px;margin-top:30px;opacity:.75}
.name{position:absolute;left:130px;top:60px;font-size:30px;font-weight:700;opacity:.55}
svg{display:block}
</style></head><body>

<!-- A · 바퀴 「아!」 : ㅇ은 타이어, ㅏ는 느낌표 -->
<div class="slide" style="background:#f3f4ef;color:#121417">
  <div class="name">A · ㅇ은 바퀴, ㅏ는 느낌표</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><radialGradient id="ag" cx="28%" cy="20%" r="100%"><stop offset="0" stop-color="#2a2f36"/><stop offset="1" stop-color="#0d0f12"/></radialGradient></defs>
    <rect width="1000" height="1000" fill="url(#ag)"/>
    <g transform="translate(500 500) scale(.84) translate(-480 -514)">
      <circle cx="345" cy="455" r="178" fill="none" stroke="#d8ff3c" stroke-width="112"/>
      <g fill="#d8ff3c">
        <circle cx="345" cy="455" r="46"/>
      </g>
      <g stroke="#0d0f12" stroke-width="22" stroke-linecap="round">
        <path d="M345 221 V256"/><path d="M345 654 V689"/><path d="M111 455 H146"/><path d="M544 455 H579"/>
        <path d="M180 290 L204 314"/><path d="M486 596 L510 620"/><path d="M510 290 L486 314"/><path d="M204 596 L180 620"/>
      </g>
      <path d="M690 250 V612 M690 432 H808" stroke="#ffffff" stroke-width="112" stroke-linecap="round" fill="none"/>
      <circle cx="690" cy="774" r="64" fill="#ffffff"/>
    </g>
  </svg></div>
  <div><div class="word">아차</div><div class="latin">ACHA</div></div>
</div>

<!-- B · 비상등: 「아차!」 하면 누르는 그 버튼 -->
<div class="slide" style="background:#fff5f2;color:#1b0f0c">
  <div class="name">B · 비상등 버튼</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a3c"/><stop offset="1" stop-color="#ff2d55"/></linearGradient></defs>
    <rect width="1000" height="1000" fill="url(#bg1)"/>
    <path d="M500 215 L800 735 H200 Z" fill="none" stroke="#fff" stroke-width="92" stroke-linejoin="round"/>
    <path d="M500 450 L605 632 H395 Z" fill="none" stroke="#fff" stroke-width="64" stroke-linejoin="round"/>
  </svg></div>
  <div><div class="word">아차<span style="color:#ff2d55">!</span></div><div class="latin">ACHA</div></div>
</div>

<!-- C · 파형 자동차: 통화 파형이 자동차 옆모습이 된다 -->
<div class="slide" style="background:#f2f1ff;color:#1a12a8">
  <div class="name">C · 통화 파형이 자동차로</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3bff"/><stop offset="1" stop-color="#2410d6"/></linearGradient></defs>
    <rect width="1000" height="1000" fill="url(#cg)"/>
    <g stroke="#d6ff3d" stroke-width="64" stroke-linecap="round">
      <path d="M190 560 V600"/>
      <path d="M285 470 V600"/>
      <path d="M380 360 V600"/>
      <path d="M475 330 V600"/>
      <path d="M570 330 V600"/>
      <path d="M665 400 V600"/>
      <path d="M760 480 V600"/>
      <path d="M840 540 V600"/>
    </g>
    <circle cx="330" cy="720" r="70" fill="#d6ff3d"/>
    <circle cx="690" cy="720" r="70" fill="#d6ff3d"/>
    <circle cx="330" cy="720" r="24" fill="#2b1ae6"/>
    <circle cx="690" cy="720" r="24" fill="#2b1ae6"/>
  </svg></div>
  <div><div class="word">아차</div><div class="latin">ACHA</div></div>
</div>

<!-- D · 느낌표의 점이 바퀴 -->
<div class="slide" style="background:#fffbe6;color:#111">
  <div class="name">D · 느낌표의 점이 바퀴</div>
  <div class="app"><svg width="420" height="420" viewBox="0 0 1000 1000">
    <rect width="1000" height="1000" fill="#ffd60a"/>
    <path d="M500 170 V560" stroke="#111" stroke-width="150" stroke-linecap="round"/>
    <circle cx="500" cy="770" r="110" fill="#111"/>
    <circle cx="500" cy="770" r="44" fill="#ffd60a"/>
    <g fill="#111"><circle cx="500" cy="770" r="14"/></g>
  </svg></div>
  <div><div class="word">아차</div><div class="latin">ACHA</div></div>
</div>
</body></html>
