<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../_tools/base.css">
<style>
.duo{display:flex;align-items:center;gap:34px;margin-top:70px}
.duo .memo{flex:0 0 400px}
.duo .memo .row{font-size:32px}
.duo .memo .k{flex-basis:110px}
.arrow{font-size:80px;font-weight:900;color:var(--accent)}
.duo .card{flex:1;padding:30px 32px}
.duo .card .f{font-size:30px;padding:14px 0}
.duo .card .f .l{flex-basis:110px}
.duo .card .h b{font-size:34px}
</style></head><body>
<div class="slide memo-top">
  <div class="kicker mt-s">안녕하세요, 아차 랩입니다</div>
  <h1>통화 끊고<br><em>「아차!」</em> 할 때.</h1>
  <p class="lead">몇 개라고 했더라? 언제까지 보내 달랬지? 걸려 온 주문 전화를 받아 적어, 확인할 수 있는 주문 카드로 남기는 AI를 만들고 있어요.</p>
  <div class="duo">
    <div class="memo">
      <div class="row"><span class="k">거래처</span><span class="v">새한?</span></div>
      <div class="row"><span class="k">차</span><span class="v">아반떼 앞범..</span></div>
      <div class="row"><span class="k">수량</span><span class="v">하나? 둘?</span></div>
    </div>
    <div class="arrow">→</div>
    <div class="card">
      <div class="h"><b>주문 카드</b><span class="fake">가짜 통화</span></div>
      <div class="f"><span class="l">거래처</span><span class="val">새한카센터</span></div>
      <div class="f"><span class="l">차종</span><span class="val">아반떼 AD</span></div>
      <div class="f"><span class="l">부품</span><span class="val">앞범퍼 × 1</span></div>
      <div class="f"><span class="l">급함</span><span class="val" style="color:var(--accent)">오늘 오후</span></div>
    </div>
  </div>
  <div class="foot"><span><b>@acha.lab.kr</b></span><span>만드는 과정을 공개합니다</span></div>
</div>
</body></html>
