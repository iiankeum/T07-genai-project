<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아차 — 전화 주문 관리</title>
<meta name="description" content="자동차 부품 대리점의 전화 주문을 받아쓰고 주문 카드로 정리하는 데모. 모든 통화는 가짜입니다.">
<meta name="theme-color" content="#0066ff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/ahcha-logo-original.jpeg" type="image/jpeg">
<link rel="apple-touch-icon" href="/assets/ahcha-logo-original.jpeg">
<link rel="preload" href="/fonts/PretendardJPVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#view">본문으로 건너뛰기</a>
<header class="topbar">
  <a class="brand" href="#/" aria-label="아차 첫 화면"><img class="brand-logo" src="/assets/ahcha-logo-original.jpeg" width="36" height="36" alt="" decoding="async"><span class="brand-name">아차</span></a>
  <div id="headerWorkspace"></div>
  <div class="topbar-path"><span class="topbar-product">전화 주문 관리</span><span class="topbar-separator" aria-hidden="true">/</span><strong id="topbarPath"></strong></div>
  <div class="topbar-right">
    <a class="btn btn-sm header-upload" href="#/upload">녹음 올리기</a>
    <a class="btn btn-primary btn-sm header-live" href="#/live">받아쓰기</a>
    <a class="worker-pill" id="workerPill" href="#/upload" title="받아쓰기 처리 상태"><span class="dot" aria-hidden="true"></span><span class="worker-text">연결 확인 중</span></a>
    <button class="btn btn-ghost btn-sm" id="bigTextBtn" type="button" aria-pressed="false">글씨 크게</button>
  </div>
</header>
<div class="layout">
  <nav class="sidenav" id="sideNav" aria-label="메뉴"></nav>
  <div class="main-column">
    <div class="fake-banner" role="note" hidden><strong>데모 워크스페이스</strong><span>모든 통화는 가짜 예시입니다. 실제 고객 녹음은 올리지 마세요.</span><a href="#/help">사용 안내</a></div>
    <div id="workspaceNoticeSlot"></div>
    <main id="view" class="view" tabindex="-1"><div class="page"><p class="loading" role="status">불러오는 중…</p></div></main>
  </div>
</div>
<nav class="tabbar" id="tabBar" aria-label="아래 메뉴"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="confirmDialog" class="confirm-dialog">
  <form method="dialog">
    <p id="confirmText"></p>
    <div class="dialog-actions"><button class="btn btn-ghost" value="no" type="submit">아니오</button><button class="btn btn-primary" value="yes" type="submit">예</button></div>
  </form>
</dialog>
<noscript><div class="page"><p>이 사이트는 자바스크립트가 켜져 있어야 동작합니다.</p></div></noscript>
</body>
</html>
